<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
  <title>Parallel lanes</title>
  <rect width="760" height="220" fill="#0d1117"/>
  <text x="24" y="28" fill="#e6edf3" font-family="Segoe UI, sans-serif" font-size="16">Concurrent pull: independent pages, capped lanes</text>
  <rect x="24" y="90" width="90" height="40" rx="6" fill="#1f6feb"/>
  <text x="69" y="115" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13">client</text>
  <rect x="620" y="90" width="110" height="40" rx="6" fill="#238636"/>
  <text x="675" y="115" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13">API</text>
  <g fill="none" stroke="#30363d" stroke-width="3">
    <line x1="120" y1="60" x2="610" y2="60"/>
    <line x1="120" y1="110" x2="610" y2="110"/>
    <line x1="120" y1="160" x2="610" y2="160"/>
  </g>
  <g>
    <circle r="8" fill="#58a6ff">
      <animate attributeName="cx" values="140;590;140" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;60;60" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#d2a8ff">
      <animate attributeName="cx" values="140;590;140" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;110;110" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#7ee787">
      <animate attributeName="cx" values="140;590;140" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;160;160" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="24" y="205" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">Works for offset pages and keyset ranges. Does not work for opaque cursors. Still has to respect the rate limit.</text>
</svg>
