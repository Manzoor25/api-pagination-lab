<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180">
  <title>Sequential pages, one request at a time</title>
  <rect width="760" height="180" fill="#0d1117"/>
  <text x="24" y="28" fill="#e6edf3" font-family="Segoe UI, sans-serif" font-size="16">Sequential pull: one page in flight</text>
  <rect x="24" y="70" width="90" height="40" rx="6" fill="#1f6feb"/>
  <text x="69" y="95" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13">client</text>
  <rect x="620" y="70" width="110" height="40" rx="6" fill="#238636"/>
  <text x="675" y="95" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13">API</text>
  <line x1="120" y1="90" x2="610" y2="90" stroke="#30363d" stroke-width="4"/>
  <g>
    <rect width="54" height="22" rx="4" fill="#d29922">
      <animate attributeName="x" values="130;540;130" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="79;79;79" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text fill="#0d1117" font-family="Segoe UI, sans-serif" font-size="11">
      <animate attributeName="x" values="138;548;138" dur="3.6s" repeatCount="indefinite"/>
      page
      <animate attributeName="y" values="94;94;94" dur="3.6s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="24" y="150" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">The next request cannot start until this page comes back. Cursor pagination is stuck in this picture.</text>
</svg>
