[project]
name = "api-pagination-lab"
version = "1.0.0"
description = "Hands-on lab: pull a million records from a REST API without losing one"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
